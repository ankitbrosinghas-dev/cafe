<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login · Café Chai Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div id="cursor"></div>

<div class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <span class="login-logo-text">Café Chai Terminal</span>
      <span class="login-logo-sub">Admin panel</span>
    </div>

    <div id="loginError" class="login-error" style="display:none"></div>
    <div id="lockoutMsg" class="login-lockout" style="display:none"></div>

    <div class="login-form" id="loginForm">
      <div class="field-group">
        <label class="field-label">Username</label>
        <input
          type="text"
          id="loginUsername"
          class="field-input"
          placeholder="Enter username"
          autocomplete="off"
          spellcheck="false"
          maxlength="32"
        >
      </div>

      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="pw-wrap">
          <input
            type="password"
            id="loginPassword"
            class="field-input"
            placeholder="Enter password"
            autocomplete="off"
            maxlength="64"
          >
          <button class="pw-toggle" type="button" onclick="togglePw()" tabindex="-1">
            <svg id="eyeIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="attempts-left" id="attemptsLeft"></div>

      <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign in</button>
    </div>

    <p class="login-footer-note">Protected area · Unauthorised access is prohibited</p>
  </div>

  <div class="login-bg-lines"></div>
</div>

<script src="../js/security.js"></script>
<script>
  /* redirect if already logged in */
  if (AdminAuth.isLoggedIn()) {
    window.location.href = 'dashboard.html';
  }

  document.getElementById('loginPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('loginUsername').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('loginPassword').focus();
  });

  function togglePw() {
    const inp = document.getElementById('loginPassword');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  function doLogin() {
    const user = document.getElementById('loginUsername').value.trim();
    const pass = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    const lockEl = document.getElementById('lockoutMsg');
    const btn = document.getElementById('loginBtn');

    errEl.style.display = 'none';
    lockEl.style.display = 'none';

    if (AdminAuth.isLockedOut()) {
      const remaining = AdminAuth.lockoutRemaining();
      lockEl.textContent = `Too many failed attempts. Try again in ${remaining} seconds.`;
      lockEl.style.display = 'block';
      return;
    }

    if (!user || !pass) {
      errEl.textContent = 'Please enter username and password.';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in...';

    setTimeout(() => {
      const result = AdminAuth.login(user, pass);
      if (result.success) {
        window.location.href = 'dashboard.html';
      } else {
        btn.disabled = false;
        btn.textContent = 'Sign in';
        if (result.lockedOut) {
          document.getElementById('loginForm').style.opacity = '0.4';
          document.getElementById('loginForm').style.pointerEvents = 'none';
          lockEl.textContent = `Account locked for ${AdminAuth.LOCKOUT_DURATION / 60} minutes due to too many failed attempts.`;
          lockEl.style.display = 'block';
        } else {
          errEl.textContent = result.message;
          errEl.style.display = 'block';
          const left = AdminAuth.MAX_ATTEMPTS - result.attempts;
          if (left <= 2 && left > 0) {
            document.getElementById('attemptsLeft').textContent = `Warning: ${left} attempt${left === 1 ? '' : 's'} remaining before lockout.`;
          }
          document.getElementById('loginPassword').value = '';
          document.getElementById('loginPassword').focus();
        }
      }
    }, 400);
  }

  const cur = document.getElementById('cursor');
  document.addEventListener('mousemove', e => { cur.style.left = e.clientX + 'px'; cur.style.top = e.clientY + 'px'; });
</script>
</body>
</html>
