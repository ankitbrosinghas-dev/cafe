<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create your account · Café Chai Terminal</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/auth.css"></head><body class="auth-page" data-auth-page="signup"><main class="auth-card"><h1>Create your account</h1><p>Use your email to save orders and track pickup status.</p><div id="authMessage" class="auth-message" role="alert" aria-live="polite"></div><form data-auth-form="signup"><label>Full name<input name="fullName" autocomplete="name" required maxlength="100"></label><label>Phone number<input name="phone" type="tel" autocomplete="tel" maxlength="30"></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><button class="place-btn" type="submit">Create account</button></form><div class="auth-links"><a href="login.html">Already have an account? Sign in</a></div></main><script type="module" src="../js/auth-pages.js"></script></body></html>
